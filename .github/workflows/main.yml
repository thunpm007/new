name: สรุปข่าวหุ้นสหรัฐรายวัน

on:
  schedule:
    # 00:00 UTC = 07:00 เวลาไทย (Asia/Bangkok, UTC+7)
    - cron: "0 0 * * *"
  workflow_dispatch: {}   # กดรันเองได้จากแท็บ Actions

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily summary
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/daily_summary.py

      - name: Commit and push summary
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add summaries/ data/
          git diff --staged --quiet || git commit -m "สรุปข่าวหุ้นสหรัฐ $(date +'%Y-%m-%d')"
          git push
